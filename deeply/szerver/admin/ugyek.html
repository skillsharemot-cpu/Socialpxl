<!--
  Deeply – Ügyek (2026-10-19)
  A saját szerver (api/) adatai egy helyen: foglalások és elakadt érdeklődők rangsorolva, állapot és megjegyzés,
  hívás / WhatsApp / e-mail egy koppintással, árajánlat-készítés, mentések, árlista közzététele.
  Helye: https://deeply.hu/admin/ugyek.html – mellette: arkalkulator_admin.html és arajanlat_keszito.html (ugyanazon a domainen,
  mert a böngésző tárolóján keresztül adják át egymásnak az adatot). Belépés: a config.php admin_key értéke.
-->
<style>
:root{--mv:#2D3C29;--cm:#F0EDE5;--gold:#D8AE47;--gold-d:#C99D36;--mg:#7E8772;--fog:#D6CBB9;--wt:#A0907F;--paper:#FAF8F3;--muted:#4E5948;--line:#DDD5C6;--err:#A33A1C;
  --f-head:"Libertinus Sans",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --grad:linear-gradient(90deg,#34462F,#25321F);--sh1:0 1px 4px rgba(45,60,41,.08),0 0 1px rgba(45,60,41,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--mv);font:400 15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.i{display:block;flex:none}
header.fx{position:sticky;top:0;z-index:40;background:var(--grad);color:var(--cm)}
header.fx .wrap{display:flex;align-items:center;gap:14px;height:60px}
header.fx .logo{width:118px;height:auto;color:var(--cm);display:block}
header.fx .ttl{font:400 20px/1 var(--f-head);opacity:.9;border-left:1px solid rgba(240,237,229,.3);padding-left:14px}
header.fx .sp{flex:1}
.hbtn{background:transparent;border:1.5px solid rgba(240,237,229,.5);color:var(--cm);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs{position:sticky;top:60px;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 10px;font:600 14px/1 var(--sans);cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button.on{color:var(--mv);border-bottom-color:var(--gold)}
.tabs .n{display:inline-block;min-width:20px;padding:2px 6px;border-radius:999px;background:var(--err);color:#fff;font-size:11px;margin-left:4px}
main{padding:18px 0 80px}
.card{background:#fff;border-radius:16px;box-shadow:var(--sh1);padding:18px}
.card+.card{margin-top:14px}
.card h2{font:400 24px/1.2 var(--f-head);margin:0 0 6px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1.5px solid var(--mv);background:transparent;color:var(--mv);padding:8px 14px;font:600 14px/1.2 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--cm)}
.btn.gold{background:var(--gold);border-color:var(--gold);box-shadow:0 4px 12px rgba(216,174,71,.35)}.btn.gold:hover{background:var(--gold-d)}
.btn.dark{background:var(--mv);border-color:var(--mv);color:var(--cm)}.btn.dark:hover{background:#1E281B}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.red{border-color:var(--err);color:var(--err)}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;font-size:16px}
.inp:focus{outline:none;border-color:var(--mv);box-shadow:0 0 0 3px rgba(126,135,114,.25)}
label.lb{display:block;font-weight:600;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* belépés */
.login{max-width:420px;margin:40px auto}
.login .row{margin-top:12px}
.err{color:var(--err);font-weight:600;margin-top:10px}
/* összesítő */
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px/1 var(--sans);cursor:pointer}
.chip.on{border-color:var(--mv);background:var(--mv);color:var(--cm)}
.chip b{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d1{background:var(--err)}.d2{background:var(--gold-d)}.d3{background:var(--mg)}
.alert{background:#F6E3DC;border-left:4px solid var(--err);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.alert ul{margin:6px 0 0;padding-left:18px}
.info{background:var(--cm);border-left:4px solid var(--wt);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
/* ügy-kártya */
.case{background:#fff;border-radius:16px;box-shadow:var(--sh1);padding:14px 16px;margin:0 0 12px;border-left:6px solid var(--mg)}
.case.p1{border-left-color:var(--err)}.case.p2{border-left-color:var(--gold-d)}
.case.closed{opacity:.72}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.badge{font:700 11px/1 var(--sans);letter-spacing:.06em;padding:5px 8px;border-radius:6px;text-transform:uppercase}
.b1{background:#F6E3DC;color:var(--err)}.b2{background:#FBF3DD;color:#8A6A1C}.b3{background:#EEF0EA;color:var(--muted)}
.kind{font-weight:600;color:var(--muted)}
.new{background:var(--gold);color:var(--mv);font:700 11px/1 var(--sans);padding:4px 7px;border-radius:6px}
.ago{margin-left:auto;color:var(--muted)}
.case h3{font:400 22px/1.2 var(--f-head);margin:8px 0 2px;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted)}
.meta b{color:var(--mv)}
.why{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.why li{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.st{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.st select{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-weight:600;font-size:14px}
.st .mt{margin-left:auto;font-size:12px;color:var(--muted)}
.det{margin-top:12px;font-size:14px}
.det dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0}
.det dt{color:var(--muted)}
.det dd{margin:0;overflow-wrap:anywhere}
.det .items{margin:0;padding-left:18px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs a{display:block;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--cm)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.det textarea{min-height:70px;margin-top:10px;font-size:15px}
.det .row{margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* mentések */
.list{margin:10px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.list li span{flex:1;min-width:160px;overflow-wrap:anywhere}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
iframe.prev{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#fff}
.log{max-height:420px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);border-radius:10px;padding:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mv);color:var(--cm);border-radius:999px;padding:10px 18px;font:600 14px/1.3 var(--sans);box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--err);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:560px){header.fx .ttl{display:none}.det dl{grid-template-columns:1fr}.det dt{margin-top:6px}.st .mt{margin-left:0;width:100%}}
</style>
</head>

<header class="fx"><div class="wrap">
  <svg class="logo" viewBox="0 0 4050 1050" role="img" aria-label="Deeply"><use href="#wm"/></svg>
  <span class="ttl">Ügyek</span><span class="sp"></span>
  <button type="button" class="hbtn" id="refresh" hidden>Frissítés</button>
</div></header>
<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button type="button" data-tab="ugyek" class="on">Ügyek<span class="n" id="newN" hidden></span></button>
  <button type="button" data-tab="mentes">Mentés</button>
  <button type="button" data-tab="beall">Beállítások</button>
</div></nav>
<main><div class="wrap" id="app"></div></main>

<script>
/* ═══════════ ALAPOK ═══════════ */
const API=(/^https?:$/.test(location.protocol)?location.origin:'')+'/api/';
const KK='deeply_admin_key_v1';
let KEY='';try{KEY=localStorage.getItem(KK)||sessionStorage.getItem(KK)||'';}catch(e){}
let DATA=null,TAB='ugyek',SHOW='open',TYPE='all',OPEN=new Set(),busy=false,IMPMSG='';
const app=document.getElementById('app');
const PRIO={1:['SÜRGŐS','b1'],2:['FONTOS','b2'],3:['NORMÁL','b3']};
const STAGE={'tételek':'a tételeknél','ingatlan':'az ingatlannál','időpont':'az időpontnál','fotó':'a fotónál','adatok':'az adatainál','cím, fotó':'a címnél / fotónál'};
const PROP={csaladi:'Családi ház',tarsashaz:'Társasház – földszint',emeletes:'Emeletes lakás'};
const HU_M=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
const HU_D=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' Ft';}
function day(iso){const p=String(iso).split('-').map(Number);if(p.length<3)return iso;const d=new Date(p[0],p[1]-1,p[2]);return HU_M[p[1]-1]+' '+p[2]+'., '+HU_D[d.getDay()];}
function when(t){const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'. '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return 'most';if(m<60)return m+' perce';const h=Math.round(m/60);if(h<24)return h+' órája';const d=Math.round(h/24);return d<30?d+' napja':when(t);}
function first(name){const p=String(name||'').trim().split(/\s+/);return p[p.length-1]||'';}
function digits(p){let d=String(p||'').replace(/\D/g,'');if(/^06/.test(d))d='36'+d.slice(2);else if(d.length===9)d='36'+d;return d;}
function kb(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' kB';}
function toast(t,bad){const o=document.querySelector('.toast');if(o)o.remove();const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),bad?6000:2600);}
function save(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}

function api(action,payload,asFile){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',
    body:JSON.stringify(Object.assign({action:action,key:KEY},payload||{}))}).then(async r=>{
    const ct=r.headers.get('content-type')||'';
    if(asFile&&r.ok&&!/json/.test(ct)){
      const m=/filename="([^"]+)"/.exec(r.headers.get('content-disposition')||'');
      return {blob:await r.blob(),name:m?m[1]:'deeply_letoltes'};
    }
    const t=await r.text();let j;
    try{j=JSON.parse(t);}catch(e){throw new Error('Váratlan válasz a szervertől ('+r.status+'). Fent van az api mappa?');}
    if(!j.ok){const e=new Error(j.error||'Ismeretlen hiba.');e.status=r.status;throw e;}
    return j;
  });
}
function authFail(e){if(e&&e.status===403){logout('A kulcs nem jó (vagy megváltozott).');return true;}return false;}

/* ═══════════ BELÉPÉS ═══════════ */
function loginView(msg){
  document.getElementById('tabs').hidden=true;document.getElementById('refresh').hidden=true;
  app.innerHTML='<div class="card login"><h2>Belépés</h2><p class="sub">Az Ügyek oldalhoz az admin-kulcs kell (a szerveren a config.php <b>admin_key</b> értéke).</p>'
    +'<label class="lb" for="k">Admin-kulcs</label><input class="inp" id="k" type="password" autocomplete="current-password" autofocus>'
    +'<label class="row small" style="margin-top:10px"><input type="checkbox" id="rem" checked> Ezen az eszközön emlékezzen rám</label>'
    +'<div class="row"><button class="btn gold" id="go">Belépés</button></div>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')
    +'<p class="small muted" style="margin-top:14px">Közös gépen ne pipáld be. Kilépni a Beállítások fülön lehet.</p></div>';
  const k=document.getElementById('k');
  const go=()=>{KEY=k.value.trim();if(!KEY)return;
    try{localStorage.removeItem(KK);sessionStorage.removeItem(KK);(document.getElementById('rem').checked?localStorage:sessionStorage).setItem(KK,KEY);}catch(e){}
    load(true);};
  document.getElementById('go').onclick=go;k.onkeydown=e=>{if(e.key==='Enter')go();};
}
function logout(msg){KEY='';try{localStorage.removeItem(KK);sessionStorage.removeItem(KK);}catch(e){}DATA=null;loginView(msg);}

/* ═══════════ ADATOK ═══════════ */
function load(first){
  if(busy)return;busy=true;
  if(first)app.innerHTML='<p class="empty">Betöltés…</p>';
  return api('inbox',{days:365}).then(j=>{DATA=j;busy=false;
    document.getElementById('tabs').hidden=false;document.getElementById('refresh').hidden=false;
    render();
  }).catch(e=>{busy=false;if(!authFail(e)){if(first||!DATA)app.innerHTML='<div class="card"><h2>Nem sikerült betölteni</h2><p class="err">'+esc(e.message)+'</p><div class="row" style="margin-top:12px"><button class="btn" onclick="load(true)">Újra</button></div></div>';else toast(e.message,true);}});
}
function cases(){
  if(!DATA)return [];
  const b=DATA.bookings.map(x=>Object.assign({kind:'booking',t:x.received},x));
  const l=DATA.leads.map(x=>Object.assign({kind:'lead',t:x.updated},x));
  return b.concat(l);
}
const isClosed=c=>c.status==='kesz'||c.status==='elutasitva';
function render(){
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  const nw=cases().filter(c=>c.status==='uj').length;
  const nn=document.getElementById('newN');nn.hidden=!nw;nn.textContent=nw;
  document.title=(nw?'('+nw+') ':'')+'Ügyek – Deeply';
  if(TAB==='ugyek')renderCases();else if(TAB==='mentes')renderBackup();else renderSettings();
}
document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();scrollTo(0,0);});
document.getElementById('refresh').onclick=()=>load(false);

/* ═══════════ ÜGYEK ═══════════ */
function renderCases(){
  const all=cases();
  const open=all.filter(c=>!isClosed(c));
  const cnt=k=>open.filter(c=>c.priority===k).length;
  let list=all.filter(c=>SHOW==='all'||(SHOW==='open'?!isClosed(c):isClosed(c))).filter(c=>TYPE==='all'||c.kind===TYPE);
  list.sort((a,b)=>(isClosed(a)-isClosed(b))||(a.priority-b.priority)||(b.t-a.t));
  let h='';
  if(DATA.errors&&DATA.errors.length){
    const recent=DATA.errors.filter(e=>Date.now()-e.t<3*86400000);
    if(recent.length)h+='<div class="alert"><b>Figyelem – hiba a levelezésnél vagy a szerveren</b> (az utolsó 3 nap):<ul>'+recent.slice(0,4).map(e=>'<li>'+esc(when(e.t))+' – '+esc(e.msg)+'</li>').join('')+'</ul><span class="small">A sikertelen leveleket a szerver háromszor újrapróbálja. Próbalevél: Beállítások fül.</span></div>';
  }
  h+='<div class="sumbar">'
    +'<span class="chip" style="cursor:default"><span class="dot d1"></span><b>'+cnt(1)+'</b> sürgős</span>'
    +'<span class="chip" style="cursor:default"><span class="dot d2"></span><b>'+cnt(2)+'</b> fontos</span>'
    +'<span class="chip" style="cursor:default"><span class="dot d3"></span><b>'+cnt(3)+'</b> normál</span></div>';
  h+='<div class="sumbar">'
    +[['open','Nyitott'],['closed','Lezárt'],['all','Mind']].map(x=>'<button type="button" class="chip'+(SHOW===x[0]?' on':'')+'" data-show="'+x[0]+'">'+x[1]+'</button>').join('')
    +'<span style="width:8px"></span>'
    +[['all','Mindkettő'],['booking','Foglalások'],['lead','Érdeklődők']].map(x=>'<button type="button" class="chip'+(TYPE===x[0]?' on':'')+'" data-type="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  h+=list.length?list.map(caseHtml).join(''):'<p class="empty">'+(SHOW==='open'?'Nincs nyitott ügy. 🎉':'Nincs ilyen ügy.')+'</p>';
  h+='<p class="small muted" style="text-align:center">Frissítve: '+esc(when(DATA.now))+' · az oldal percenként magától frissül.</p>';
  app.innerHTML=h;
  app.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{SHOW=b.dataset.show;renderCases();});
  app.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{TYPE=b.dataset.type;renderCases();});
  app.querySelectorAll('.case').forEach(bindCase);
}
function caseKey(c){return c.kind+':'+c.id;}
function caseHtml(c){
  const d=c.data||{};const cu=d.customer||{};
  const k=caseKey(c);const open=OPEN.has(k);
  const p=PRIO[c.priority]||PRIO[3];
  const dates=(d.dates||[]).slice().sort();
  const ph=digits(c.phone);
  const addr=[c.zip||cu.zip,c.address||cu.address].filter(Boolean).join(' ');
  const waText=c.kind==='booking'?'Szia '+first(c.name)+'! A Deeplytől írunk a foglalásod miatt.':'Szia '+first(c.name)+'! A Deeplytől írunk – láttuk, hogy árat számoltál nálunk. Segíthetünk?';
  let h='<article class="case p'+c.priority+(isClosed(c)?' closed':'')+'" data-k="'+esc(k)+'">';
  h+='<div class="ch"><span class="badge '+p[1]+'">'+p[0]+'</span>'
    +'<span class="kind">'+(c.kind==='booking'?'Foglalás':'Érdeklődő – elakadt '+esc(STAGE[c.stage]||c.stage||''))+'</span>'
    +(c.status==='uj'?'<span class="new">ÚJ</span>':'')+'<span class="ago" title="'+esc(when(c.t))+'">'+esc(ago(c.t))+'</span></div>';
  h+='<h3>'+esc(c.name||'Névtelen')+'</h3>';
  h+='<div class="meta"><b>'+(c.total?fmt(c.total):'még nincs ár')+'</b>'+(dates.length?' · legkorábban '+esc(day(dates[0])):'')+(addr?' · '+esc(addr):'')+'</div>';
  if(c.reasons&&c.reasons.length)h+='<ul class="why">'+c.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';
  h+='<div class="acts">'
    +(ph?'<a class="btn dark sm" href="tel:+'+ph+'">Hívás</a><a class="btn sm" href="https://wa.me/'+ph+'?text='+encodeURIComponent(waText)+'" target="_blank" rel="noopener">WhatsApp</a>':'')
    +(c.email?'<a class="btn sm" href="mailto:'+esc(c.email)+'?subject='+encodeURIComponent('Ajánlat – Deeply')+'">E-mail</a>':'')
    +(addr?'<a class="btn sm" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr)+'" target="_blank" rel="noopener">Térkép</a>':'')
    +'</div>';
  h+='<div class="st"><select data-status aria-label="Állapot">'+Object.keys(DATA.statuses).map(s=>'<option value="'+s+'"'+(s===c.status?' selected':'')+'>'+esc(DATA.statuses[s])+'</option>').join('')+'</select>'
    +'<button type="button" class="btn sm" data-more aria-expanded="'+open+'">'+(open?'Kevesebb':'Részletek')+'</button>'
    +'<span class="mt">'+mailState(c)+'</span></div>';
  if(open)h+=detHtml(c);
  return h+'</article>';
}
function mailState(c){
  if(c.kind==='lead')return ({1:'✓ jelzés elment',2:'közben foglalt',3:'nincs telefonszám – nem jeleztünk','-1':'✗ a jelzés nem ment ki'})[c.alerted]||'jelzés: 30 perc csend után';
  const n=({1:'✓ értesítő',0:'értesítő: folyamatban','-1':'✗ értesítő nem ment ki'})[c.notified]||'';
  const v=({1:'✓ visszaigazolás',0:'visszaigazolás: folyamatban','-1':'✗ visszaigazolás nem ment ki','-2':'nincs vevői levél'})[c.confirmed]||'';
  return n+' · '+v;
}
function detHtml(c){
  const d=c.data||{};const cu=d.customer||{};
  const items=(d.items||[]).map(it=>typeof it==='string'?esc(it):esc(it.label||it.name||'')+(it.total?' — <b>'+fmt(it.total)+'</b>':''));
  const pr=d.property;
  const prop=!pr?'–':(typeof pr==='string'?pr:(PROP[pr.type]||pr.type||'–')+(pr.type==='emeletes'?' – '+(pr.floor||'?')+'. emelet, '+(pr.lift?'van lift':'nincs lift'):''));
  const photo=d.noPhoto?'<b style="color:var(--err)">nincs – telefonon kell egyeztetni</b>':(d.photoVia==='whatsapp'?'<b>WhatsAppon küldi</b>':'');
  let h='<div class="det"><dl>'
    +'<dt>Telefon</dt><dd>'+esc(c.phone||'–')+'</dd><dt>E-mail</dt><dd>'+esc(c.email||'–')+'</dd>'
    +'<dt>Tételek</dt><dd>'+(items.length?'<ul class="items"><li>'+items.join('</li><li>')+'</li></ul>':'–')+'</dd>'
    +(c.kind==='booking'&&d.travelFee?'<dt>Kiszállás</dt><dd>'+fmt(d.travelFee)+'</dd>':'')
    +'<dt>Napok</dt><dd>'+((d.dates||[]).length?esc((d.dates||[]).slice().sort().map(day).join(', ')):'–')+(cu.timepref?' · '+esc(cu.timepref):'')+'</dd>'
    +'<dt>Ingatlan</dt><dd>'+esc(prop)+'</dd>'
    +'<dt>Fotó</dt><dd>'+(photo||((c.photos||[]).length?(c.photos.length+' db'):'–'))
    +((c.photos||[]).length?'<div class="thumbs">'+c.photos.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="Fotó '+(i+1)+'" loading="lazy"></a>').join('')+'</div>':'')+'</dd>'
    +'<dt>Megjegyzése</dt><dd>'+esc(cu.note||'–')+'</dd>'
    +'<dt>Érdeklődés</dt><dd>'+esc(d.interest||'–')+'</dd>'
    +'<dt>Forrás</dt><dd>'+esc(c.src||d.src||'–')+' · '+esc(when(c.created))+(c.kind==='booking'?' · '+esc(c.id):'')+'</dd>'
    +'</dl>';
  h+='<label class="lb" style="margin-top:12px" for="n_'+esc(c.id)+'">Saját megjegyzés</label><textarea class="inp" id="n_'+esc(c.id)+'" data-note placeholder="pl. visszahívni holnap 10-kor">'+esc(c.note||'')+'</textarea>';
  h+='<div class="row"><button type="button" class="btn sm dark" data-savenote>Megjegyzés mentése</button>'
    +(c.kind==='booking'?'<button type="button" class="btn sm gold" data-offer>Árajánlat készítése</button>':'')
    +'<span style="flex:1"></span><button type="button" class="btn sm red" data-del>Törlés</button></div></div>';
  return h;
}
function findCase(k){return cases().find(c=>caseKey(c)===k);}
function patchLocal(c,patch){const arr=c.kind==='booking'?DATA.bookings:DATA.leads;const o=arr.find(x=>x.id===c.id);if(o)Object.assign(o,patch);}
function bindCase(el){
  const k=el.dataset.k;const c=findCase(k);if(!c)return;
  el.querySelector('[data-more]').onclick=()=>{OPEN.has(k)?OPEN.delete(k):OPEN.add(k);renderCases();};
  el.querySelector('[data-status]').onchange=e=>{
    const st=e.target.value;const ta=el.querySelector('[data-note]');const note=ta?ta.value:(c.note||'');
    api('status',{type:c.kind,id:c.id,status:st,note:note}).then(()=>{patchLocal(c,{status:st,note:note});toast('Állapot: '+DATA.statuses[st]);render();})
      .catch(err=>{if(!authFail(err)){toast(err.message,true);renderCases();}});
  };
  const sn=el.querySelector('[data-savenote]');
  if(sn)sn.onclick=()=>{const note=el.querySelector('[data-note]').value;sn.disabled=true;
    api('status',{type:c.kind,id:c.id,status:c.status,note:note}).then(()=>{patchLocal(c,{note:note});toast('Megjegyzés mentve');sn.disabled=false;})
      .catch(err=>{sn.disabled=false;if(!authFail(err))toast(err.message,true);});};
  const of=el.querySelector('[data-offer]');
  if(of)of.onclick=()=>toOffer(c);
  const dl=el.querySelector('[data-del]');
  if(dl)dl.onclick=()=>{
    if(!confirm('Végleg törlöd '+(c.name||'ezt az ügyet')+' adatait'+(c.kind==='booking'?' (a fotókkal együtt)':'')+'?\nPl. ha az ügyfél kéri (GDPR). Ez nem vonható vissza – ha kell, előbb készíts mentést.'))return;
    api('delete',{type:c.kind,id:c.id}).then(()=>{
      const arr=c.kind==='booking'?DATA.bookings:DATA.leads;const i=arr.findIndex(x=>x.id===c.id);if(i>=0)arr.splice(i,1);
      toast('Törölve');render();}).catch(err=>{if(!authFail(err))toast(err.message,true);});
  };
}
/* Árajánlat: a foglalást átadjuk az árajánlat-készítőnek (ugyanaz a domain → közös böngészőtároló). */
function toOffer(c){
  const b=Object.assign({},c.data||{},{photos:c.photos||[],created:c.created,id:c.id});
  let arr=[];try{arr=JSON.parse(localStorage.getItem('tc_bookings_v1')||'[]');}catch(e){}
  if(!arr.some(x=>x.created===b.created)){arr.push(b);
    try{localStorage.setItem('tc_bookings_v1',JSON.stringify(arr));}catch(e){toast('A böngésző tárolója megtelt – az árajánlat-készítőben töröld a régi foglalásokat.',true);return;}}
  try{localStorage.setItem('tc_offer_pick_v1',JSON.stringify({created:b.created}));}catch(e){}
  const w=window.open('arajanlat_keszito.html','_blank');
  if(!w)location.href='arajanlat_keszito.html';
  if(c.status==='uj'||c.status==='hivva'){api('status',{type:'booking',id:c.id,status:'ajanlat',note:c.note||''}).then(()=>{patchLocal(c,{status:'ajanlat'});render();}).catch(()=>{});}
}

/* ═══════════ MENTÉS ═══════════ */
function renderBackup(){
  const sn=DATA.snapshots||[];
  let h='<div class="card"><h2>Biztonsági mentés</h2>'
    +'<p class="sub">A szerver <b>naponta magától</b> mentést készít az adatbázisról (a legutóbbi 30 marad meg). Ezen felül <b>hetente egyszer</b> töltsd le a teljes mentést és a fotókat a gépre vagy a Google Drive-ra – így akkor sem vész el semmi, ha a tárhellyel gond van.</p>'
    +'<div class="row"><button class="btn gold" id="bExp">Teljes mentés letöltése (JSON)</button><button class="btn" id="bPh">Fotók letöltése (ZIP)</button></div>'
    +'<p class="small muted" style="margin-top:8px">A JSON-ban minden foglalás, érdeklődő és a közzétett árlista benne van; a fotók külön fájlban.</p></div>';
  h+='<div class="card"><h2>Napi adatbázis-mentések</h2><p class="sub">'+(sn.length?'Utolsó: '+esc(when(sn[0].time))+' · '+sn.length+' db a szerveren':'Még nincs mentés – az első ügy után készül el.')+'</p>'
    +'<div class="row"><button class="btn" id="bSnap">Mentés most</button></div>'
    +(sn.length?'<ul class="list">'+sn.map(s=>'<li><span>'+esc(when(s.time))+' · '+kb(s.size)+'</span><button class="btn sm" data-snap="'+esc(s.name)+'">Letöltés</button></li>').join('')+'</ul>':'')
    +'<p class="small muted" style="margin-top:8px">Ez maga az adatbázis-fájl (SQLite). Visszaállításhoz: a tárhelyen cseréld le vele a régit (lásd TELEPITES.txt), vagy kérj segítséget.</p></div>';
  h+='<div class="card"><h2>Visszatöltés</h2><p class="sub">Egy korábban letöltött teljes mentés (vagy a régi admin „Teljes mentés” fájlja) visszatöltése. Nem töröl semmit: csak a hiányzó ügyek kerülnek be, levelet nem küld.</p>'
    +'<label class="btn" for="bImp">Fájl kiválasztása…</label><input type="file" id="bImp" accept=".json,application/json" class="sr"><p id="impRes" class="small" style="margin-top:8px">'+IMPMSG+'</p></div>';
  app.innerHTML=h;
  const dlBtn=(id,action,payload)=>{const b=document.getElementById(id);if(!b)return;b.onclick=()=>{b.disabled=true;
    api(action,payload,true).then(r=>{b.disabled=false;
      if(r.blob)save(r.name,r.blob);else save(r.file||'deeply_mentes.json',new Blob([JSON.stringify(r.backup,null,1)],{type:'application/json'}));
      toast('Letöltve');}).catch(e=>{b.disabled=false;if(!authFail(e))toast(e.message,true);});};};
  dlBtn('bExp','export');dlBtn('bPh','photos_archive');
  document.getElementById('bSnap').onclick=e=>{e.target.disabled=true;api('snapshot').then(j=>{DATA.snapshots=j.snapshots;toast('Mentés kész');renderBackup();}).catch(err=>{e.target.disabled=false;if(!authFail(err))toast(err.message,true);});};
  app.querySelectorAll('[data-snap]').forEach(b=>b.onclick=()=>{b.disabled=true;api('snapshot_download',{name:b.dataset.snap},true).then(r=>{b.disabled=false;save(r.name,r.blob);}).catch(e=>{b.disabled=false;if(!authFail(e))toast(e.message,true);});});
  document.getElementById('bImp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    const out=document.getElementById('impRes');out.textContent='Feltöltés…';
    f.text().then(t=>{let data;try{data=JSON.parse(t);}catch(err){throw new Error('Ez nem JSON-fájl.');}
      return api('import',{data:data});})
    .then(j=>{const a=j.added;IMPMSG=esc('Kész: '+a.bookings+' új foglalás, '+a.leads+' új érdeklődő'+(a.pricing?', árlista':'')+'.');out.innerHTML=IMPMSG;load(false);})
    .catch(err=>{if(!authFail(err))out.innerHTML='<span class="err">'+esc(err.message)+'</span>';});};
}

/* ═══════════ BEÁLLÍTÁSOK ═══════════ */
function localPricing(){try{return JSON.parse(localStorage.getItem('tc_pricing_v1')||'null');}catch(e){return null;}}
function renderSettings(){
  const lp=localPricing();
  let h='<div class="card"><h2>Árlista közzététele</h2>'
    +'<p class="sub">Az árakat az <a href="arkalkulator_admin.html">Admin oldalon</a> szerkesztitek (ebben a böngészőben). Utána itt egy gombbal közzéteszitek – innentől minden látogató a kalkulátorban az új árakat látja.</p>'
    +'<p class="small">Közzétéve: <b>'+(DATA.pricingUpdated?esc(when(DATA.pricingUpdated)):'még soha (a kalkulátor a beépített alapárakat mutatja)')+'</b></p>'
    +(lp&&Array.isArray(lp.services)?'<p class="small">Ebben a böngészőben: <b>'+lp.services.length+' szolgáltatás</b>, '+(lp.materials||[]).length+' anyag, '+(lp.stains||[]).length+' folt-típus, '+(lp.addons||[]).length+' kiegészítő.</p>'
      +'<details class="small"><summary>Árak megtekintése</summary><ul>'+lp.services.map(s=>'<li>'+esc(s.name)+' – '+fmt(s.price)+' / '+esc(s.unit)+'</li>').join('')+'</ul></details>'
      +'<div class="row" style="margin-top:10px"><button class="btn gold" id="pPub">Közzététel</button></div>'
      :'<div class="info">Ebben a böngészőben még nincs szerkesztett árlista. Nyisd meg az Admin oldalt ugyanezen a domainen, állítsd be az árakat, majd gyere vissza ide.</div>')
    +'<p class="small muted" style="margin-top:8px">A beszerzési adatok (vegyszerek, gépek) nem kerülnek nyilvánosságra.</p></div>';
  h+='<div class="card"><h2>E-mail értesítések</h2>'
    +'<p class="sub">Az új foglalásokról és az elakadt érdeklődőkről ide megy levél: <b>'+esc((DATA.notifyTo||[]).join(', ')||'– (nincs beállítva a config.php-ban)')+'</b>. A vevő automatikus visszaigazolást kap.</p>'
    +'<div class="row"><button class="btn" id="mTest">Próbalevél küldése</button><span id="mRes" class="small"></span></div>'
    +'<p class="sub" style="margin:16px 0 4px"><b>Levélminták</b> – így néznek ki a levelek:</p>'
    +'<div class="mtabs"><button class="btn sm" data-prev="booking">Új foglalás (nektek)</button><button class="btn sm" data-prev="lead">Elakadt érdeklődő (nektek)</button><button class="btn sm" data-prev="confirm">Visszaigazolás (vevőnek)</button></div>'
    +'<div id="prevBox"></div></div>';
  h+='<div class="card"><h2>Napló</h2><p class="sub">A szerver eseményei (levelek, mentések, hibák).</p><div class="row"><button class="btn sm" id="lg">Napló megnyitása</button></div><div id="lgBox"></div></div>';
  h+='<div class="card"><h2>Kilépés</h2><p class="sub">Ezen az eszközön elfelejti az admin-kulcsot.</p><button class="btn red" id="out">Kilépés</button></div>';
  app.innerHTML=h;
  const pb=document.getElementById('pPub');
  if(pb)pb.onclick=()=>{if(!confirm('Közzéteszed az árlistát? A kalkulátorban minden látogató ezt fogja látni.'))return;pb.disabled=true;
    api('pricing_save',{pricing:localPricing()}).then(j=>{DATA.pricingUpdated=j.updated;toast('Árlista közzétéve');renderSettings();}).catch(e=>{pb.disabled=false;if(!authFail(e))toast(e.message,true);});};
  document.getElementById('mTest').onclick=e=>{const r=document.getElementById('mRes');e.target.disabled=true;r.textContent='Küldés…';
    api('mailtest').then(j=>{e.target.disabled=false;r.textContent='✓ Elküldve: '+j.sentTo.join(', ')+' – nézd meg a postafiókot (a spam mappát is).';})
      .catch(err=>{e.target.disabled=false;if(!authFail(err))r.innerHTML='<span class="err">'+esc(err.message)+'</span>';});};
  app.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{const box=document.getElementById('prevBox');box.innerHTML='<p class="small muted">Betöltés…</p>';
    api('mailpreview').then(j=>{const m=j.mails[b.dataset.prev];box.innerHTML='<p class="small"><b>Tárgy:</b> '+esc(m.subject)+'</p><iframe class="prev" sandbox title="Levélminta"></iframe>';box.querySelector('iframe').srcdoc=m.html;})
      .catch(e=>{if(!authFail(e))box.innerHTML='<p class="err">'+esc(e.message)+'</p>';});});
  document.getElementById('lg').onclick=()=>{api('log').then(j=>{document.getElementById('lgBox').innerHTML='<div class="log">'+(j.log.length?j.log.map(l=>esc(when(l.t))+'  ['+esc(l.kind)+']  '+esc(l.msg)).join('<br>'):'Üres.')+'</div>';}).catch(e=>{if(!authFail(e))toast(e.message,true);});};
  document.getElementById('out').onclick=()=>logout('');
}

/* ═══════════ INDULÁS + percenkénti frissítés ═══════════ */
if(KEY)load(true);else loginView('');
setInterval(()=>{
  if(!KEY||!DATA||document.visibilityState!=='visible'||TAB!=='ugyek')return;
  const a=document.activeElement;if(a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName))return;
  load(false);
},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&KEY&&DATA&&TAB==='ugyek')load(false);});
</script>
